name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.57.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: test
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./examples/http-server

  quan-integration:
    runs-on: ubuntu-latest
    env:
      QUAN_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mini_jupiter?parseTime=true&loc=Local&charset=utf8mb4
      QUAN_TEST_REDIS_MODE: sentinel
      QUAN_TEST_REDIS_ADDRS: 127.0.0.1:26379,127.0.0.1:26380,127.0.0.1:26381
      QUAN_TEST_REDIS_MASTER_NAME: mymaster
      QUAN_TEST_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/
      QUAN_TEST_RABBITMQ_CONTAINER: mini-jupiter-rabbitmq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: start quan dependencies
        run: docker compose up -d mysql rabbitmq redis-master redis-replica redis-sentinel-1 redis-sentinel-2 redis-sentinel-3
      - name: wait mysql
        run: |
          for i in {1..40}; do
            (echo > /dev/tcp/127.0.0.1/3306) >/dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1
      - name: wait redis
        run: |
          for i in {1..40}; do
            (echo > /dev/tcp/127.0.0.1/6379) >/dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1
      - name: wait rabbitmq
        run: |
          for i in {1..40}; do
            (echo > /dev/tcp/127.0.0.1/5672) >/dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1
      - name: quan current-architecture tests
        run: go test ./examples/Quan/... -count=1 -v
      - name: stop quan dependencies
        if: always()
        run: docker compose down -v
