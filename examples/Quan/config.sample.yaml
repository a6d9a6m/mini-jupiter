app:
  name: quan
  env: dev

http:
  addr: ":8081"

log:
  level: "info"
  encoding: "console"

middleware:
  recovery: true
  trace_id: true
  logging: true

metric:
  enabled: true
  path: "/metrics"
  namespace: "mini_jupiter_quan"

redis:
  enabled: true
  mode: "sentinel"
  addr: "127.0.0.1:6379"
  addrs:
    - "127.0.0.1:26379"
    - "127.0.0.1:26380"
    - "127.0.0.1:26381"
  master_name: "mymaster"
  password: ""
  sentinel_username: ""
  sentinel_password: ""
  db: 0
  dial_timeout: "2s"

rabbitmq:
  enabled: true
  url: "amqp://guest:guest@127.0.0.1:5672/"
  dial_timeout: "5s"
  heartbeat: "10s"

mysql:
  enabled: true
  dsn: "root:root@tcp(127.0.0.1:3306)/mini_jupiter?parseTime=true&loc=Local&charset=utf8mb4"
  max_open_conns: 400
  max_idle_conns: 200
  conn_max_lifetime: "30m"
  conn_timeout: "2s"

migration:
  enabled: true
  dir: "examples/Quan/sql"
  table_name: "schema_migrations"

coupon:
  claim:
    idempotency_ttl: "24h"
    request_mq:
      exchange: "quan.claim.request"
      queue: "quan.claim.request.accepted"
      routing_key: "claim.request.accepted"
      consumer_tag: "quan-claim-request-consumer"
      publisher_channels: 16
      consumer_workers: 16
      prefetch: 64
      confirm_timeout: "3s"
      requeue_delay: "10ms"
    reservation_reconcile:
      enabled: true
      poll_interval: "2s"
      batch_size: 100
    default_per_user_limit: 1
