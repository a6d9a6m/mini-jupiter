services:
  prometheus:
    image: prom/prometheus
    container_name: mini-jupiter-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: mini-jupiter-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  redis-master:
    image: redis:7-alpine
    container_name: mini-jupiter-redis-master
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/redis-ha/redis-master.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_master_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis-replica:
    image: redis:7-alpine
    container_name: mini-jupiter-redis-replica
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6380:6380"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/redis-ha/redis-replica.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_replica_data:/data
    depends_on:
      - redis-master
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: mini-jupiter-redis-sentinel-1
    command: ["redis-server", "/etc/redis/sentinel.conf", "--sentinel"]
    ports:
      - "26379:26379"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/redis-ha/sentinel-1.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: mini-jupiter-redis-sentinel-2
    command: ["redis-server", "/etc/redis/sentinel.conf", "--sentinel"]
    ports:
      - "26380:26380"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/redis-ha/sentinel-2.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: mini-jupiter-redis-sentinel-3
    command: ["redis-server", "/etc/redis/sentinel.conf", "--sentinel"]
    ports:
      - "26381:26381"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/redis-ha/sentinel-3.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26381", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: mini-jupiter-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=mini_jupiter
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: mini-jupiter-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  mysql_data:
  redis_master_data:
  redis_replica_data:
