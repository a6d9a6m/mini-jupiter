services:
  redis-master:
    image: redis:7-alpine
    container_name: mini-jupiter-redis-sentinel-test-master
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6389:6379"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./redis-master.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis-replica:
    image: redis:7-alpine
    container_name: mini-jupiter-redis-sentinel-test-replica
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6390:6379"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./redis-replica.conf:/usr/local/etc/redis/redis.conf:ro
    depends_on:
      - redis-master
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: mini-jupiter-redis-sentinel-test-1
    command: ["redis-server", "/etc/redis/sentinel.conf", "--sentinel"]
    ports:
      - "36379:26379"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./sentinel-1.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: mini-jupiter-redis-sentinel-test-2
    command: ["redis-server", "/etc/redis/sentinel.conf", "--sentinel"]
    ports:
      - "36380:26379"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./sentinel-2.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: mini-jupiter-redis-sentinel-test-3
    command: ["redis-server", "/etc/redis/sentinel.conf", "--sentinel"]
    ports:
      - "36381:26379"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./sentinel-3.conf:/etc/redis/sentinel.conf
    depends_on:
      - redis-master
      - redis-replica
